<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-Reseñas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px 20px;
      text-align: center;
      background: #f5f5f5;
    }

    .contenedor {
      background: white;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    .boton {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      text-decoration: none;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <h1>QR-Reseñas</h1>

    <p>
      Tu sistema de reseñas mediante código QR.
    </p>

    <a href="#" class="boton">⭐ Dejar una reseña</a>

    <a href="#" class="boton">📋 Ver reseñas</a>
  </div>
</body>
</html>
