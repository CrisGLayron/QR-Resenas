<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-Reseñas</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f5f5f5;
    }

    .contenedor {
      background: white;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    p {
      color: #555;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #mensaje {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>QR-Reseñas</h1>

    <p>Déjanos tu opinión. Nos ayuda a mejorar.</p>

    <form id="formulario">

      <label for="nombre">Tu nombre</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Escribe tu nombre"
        required
      >

      <label for="estrellas">Valoración</label>
      <select id="estrellas" name="estrellas" required>
        <option value="">Selecciona una valoración</option>
        <option value="5">⭐⭐⭐⭐⭐ - Excelente</option>
        <option value="4">⭐⭐⭐⭐ - Muy bien</option>
        <option value="3">⭐⭐⭐ - Bien</option>
        <option value="2">⭐⭐ - Mejorable</option>
        <option value="1">⭐ - Mala</option>
      </select>

      <label for="resena">Tu reseña</label>
      <textarea
        id="resena"
        name="resena"
        placeholder="Escribe aquí tu opinión..."
        required
      ></textarea>

      <button type="submit">Enviar reseña</button>

    </form>

    <div id="mensaje"></div>

  </div>

  <script>
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbzDs_F4CNSFhga6Dk29jIWE5cHt12_fethhRaPwujfXuPecVfaSE6MO4OnhRIidlyoc/exec";

    const formulario = document.getElementById("formulario");
    const mensaje = document.getElementById("mensaje");

    formulario.addEventListener("submit", async function(evento) {
      evento.preventDefault();

      mensaje.textContent = "Enviando reseña...";

      const datos = new FormData(formulario);

      try {
        await fetch(URL_APPS_SCRIPT, {
          method: "POST",
          body: datos,
          mode: "no-cors"
        });

        formulario.reset();
        mensaje.textContent = "¡Gracias! Tu reseña ha sido enviada.";

      } catch (error) {
        mensaje.textContent =
          "No se ha podido enviar la reseña. Inténtalo de nuevo.";
      }
    });
  </script>

</body>
</html>
